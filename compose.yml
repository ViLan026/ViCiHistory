services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: history-verifier-api

    restart: unless-stopped

    env_file:
      - .env


    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      PORT: 8080
      SOURCE_CACHE_DIR: /app/.cache/history_sources
      BM25_INDEX_PATH: /app/runtime/bm25/bm25_index.pkl

    ports:
      - "8080:8080"

    volumes:
      - source_cache:/app/.cache/history_sources
      - ./app/data:/app/runtime/bm25:ro

    networks:
      - history_ai


volumes:
  source_cache:

networks:
  history_ai:
    driver: bridge